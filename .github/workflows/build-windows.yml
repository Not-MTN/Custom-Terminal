name: Build Ghosty for Windows

on:
  push:
    branches: [arena/32757ab8-custom-terminal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Ghosty-Windows-Installer
          path: release/Ghosty-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
