name: Build Ghosty for Windows

on:
  push:
    branches: [arena/32757ab8-custom-terminal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parse PowerShell setup script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/apply-setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell setup script has syntax errors.' }
          $source = Get-Content scripts/apply-setup.ps1 -Raw
          if ($source -match '--disable-interactivity') { throw 'Unsupported WinGet option detected.' }
          if ($source -match '\$profile\s*=') { throw 'Do not shadow the automatic $PROFILE variable.' }
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Ghosty-Windows-v1.0.6
          path: release/Ghosty-*.exe
          if-no-files-found: error
          retention-days: 30
